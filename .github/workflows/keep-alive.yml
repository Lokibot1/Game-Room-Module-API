name: Keep Render app alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed app
        run: |
          if [ -z "${{ vars.RENDER_URL }}" ]; then
            echo "RENDER_URL repository variable is not set. Skipping ping."
            echo "Set it at: Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          curl -fsS --max-time 20 "${{ vars.RENDER_URL }}/api/ping"
